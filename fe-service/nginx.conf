server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy requests to backend if needed to avoid CORS
    # But currently CORS is handled by the BE service and VITE_BE_URL env is used
}
